<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Indonesia Stock Monitor</title>
    <style>
        :root {
            --bg: #f3f7ff;
            --surface: rgba(255, 255, 255, 0.88);
            --surface-strong: #ffffff;
            --primary: #1d4ed8;
            --primary-dark: #173ea8;
            --accent: #22c55e;
            --text: #122033;
            --muted: #5b6b82;
            --border: rgba(18, 32, 51, 0.08);
            --shadow: 0 18px 40px rgba(29, 78, 216, 0.12);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background: #e7eceb;
            color: var(--text);
            padding: 24px;
        }

        .app-shell {
            width: min(980px, 100%);
            background: var(--surface);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border);
            border-radius: 24px;
            box-shadow: var(--shadow);
            overflow: hidden;
        }

        .topbar {
            background: #d97706;
            color: white;
            padding: 26px 28px 22px;
        }

        .topbar h1 {
            margin: 0;
            font-size: clamp(1.8rem, 3vw, 2.5rem);
            font-weight: 700;
            letter-spacing: -0.04em;
        }

        .topbar p {
            margin: 10px 0 0;
            color: rgba(255, 255, 255, 0.8);
            font-size: 0.95rem;
        }

        .content {
            display: grid;
            grid-template-columns: 340px 1fr;
            gap: 24px;
            padding: 28px;
        }

        .panel {
            background: var(--surface-strong);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 22px;
        }

        .form-group { margin-bottom: 18px; }

        label {
            display: block;
            font-size: 0.85rem;
            color: var(--muted);
            font-weight: 600;
            margin-bottom: 10px;
            letter-spacing: 0.02em;
        }

        select, button {
            width: 100%;
            border-radius: 12px;
            font-size: 1rem;
        }

        select {
            padding: 14px 16px;
            border: 1px solid rgba(30, 58, 138, 0.15);
            background: #f8fbff;
            color: var(--text);
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        select:focus {
            border-color: rgba(29, 78, 216, 0.7);
            box-shadow: 0 0 0 4px rgba(29, 78, 216, 0.08);
        }

        button {
            border: none;
            background: #d97706;
            color: white;
            padding: 14px 18px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease, opacity 0.2s ease;
            box-shadow: 0 12px 22px rgba(217, 119, 6, 0.25);
        }

        button:hover {
            transform: translateY(-1px);
            background: #b45309;
            box-shadow: 0 14px 24px rgba(180, 83, 9, 0.3);
        }

        .status-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-top: 18px;
            padding-top: 16px;
            border-top: 1px solid var(--border);
        }

        .status-label { color: var(--muted); font-weight: 600; }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            border-radius: 999px;
            font-size: 0.85rem;
            font-weight: 700;
            background: rgba(15, 23, 42, 0.06);
            color: var(--text);
        }

        .status-badge::before {
            content: "";
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: #f59e0b;
            display: inline-block;
            box-shadow: 0 0 0 4px rgba(245, 158, 11, 0.18);
        }

        .status-badge.connected::before {
            background: var(--accent);
            box-shadow: 0 0 0 4px rgba(34, 197, 94, 0.15);
        }

        .status-badge.error::before {
            background: #ef4444;
            box-shadow: 0 0 0 4px rgba(239, 68, 68, 0.15);
        }

        .market-card {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .ticker-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 16px;
            margin-bottom: 8px;
        }

        .ticker-header h2 {
            margin: 0;
            font-size: clamp(1.5rem, 2vw, 2.1rem);
            letter-spacing: -0.04em;
        }

        .ticker-header small {
            display: block;
            color: var(--muted);
            margin-top: 6px;
            font-size: 0.9rem;
        }

        .price-pill {
            background: linear-gradient(135deg, #dcfce7 0%, #bbf7d0 100%);
            border: 1px solid rgba(34, 197, 94, 0.2);
            color: #166534;
            border-radius: 999px;
            padding: 10px 14px;
            font-size: 0.85rem;
            font-weight: 700;
            white-space: nowrap;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 14px;
        }

        .stat-box {
            background: linear-gradient(180deg, #f8fbff 0%, #eef5ff 100%);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 18px 16px;
        }

        .stat-box .label {
            display: block;
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--muted);
            margin-bottom: 12px;
            font-weight: 700;
        }

        .stat-box .value {
            font-size: clamp(1.2rem, 2vw, 1.8rem);
            font-weight: 800;
            letter-spacing: -0.03em;
            color: var(--text);
        }

        .empty-state {
            color: var(--muted);
            font-size: 0.95rem;
            line-height: 1.7;
        }

        @media (max-width: 760px) {
            .content { grid-template-columns: 1fr; }
            .stats-grid { grid-template-columns: 1fr; }
            .ticker-header { flex-direction: column; }
        }
    </style>
</head>

<body>
    <div class="app-shell">
        <header class="topbar">
            <h1>Indonesia Stock Monitor</h1>
            <p>Pantau kinerja saham pilihan Anda dengan data real-time.</p>
        </header>

        <main class="content">
            <section class="panel">
                <div class="form-group">
                    <label for="stockSelect">Pilih saham</label>
                    <select id="stockSelect">
                        <option value="BBCA.JK">Bank Central Asia (BBCA)</option>
                        <option value="BBRI.JK">Bank Rakyat Indonesia (BBRI)</option>
                        <option value="BMRI.JK">Bank Mandiri (BMRI)</option>
                        <option value="BBNI.JK">Bank Negara Indonesia (BBNI)</option>
                        <option value="BRIS.JK">Bank Syariah Indonesia (BRIS)</option>
                        <option value="TLKM.JK">Telkom Indonesia (TLKM)</option>
                        <option value="ASII.JK">Astra International (ASII)</option>
                        <option value="GOTO.JK">GoTo (GOTO)</option>
                        <option value="AMMN.JK">Amman Mineral (AMMN)</option>
                        <option value="ICBP.JK">Indofood CBP (ICBP)</option>
                        <option value="UNVR.JK">Unilever Indonesia (UNVR)</option>
                    </select>
                </div>

                <button onclick="connectSocket()">Hubungkan</button>

                <div class="status-row">
                    <span class="status-label">Status</span>
                    <span id="connectionStatus" class="status-badge">Disconnected</span>
                </div>
            </section>

            <section class="panel market-card">
                <div class="ticker-header">
                    <div>
                        <h2 id="symbol">-</h2>
                        <small id="company">Pilih saham untuk melihat data</small>
                    </div>
                    <span class="price-pill">Realtime</span>
                </div>

                <div class="stats-grid">
                    <div class="stat-box">
                        <span class="label">Harga Saat Ini</span>
                        <span id="price" class="value">-</span>
                    </div>
                    <div class="stat-box">
                        <span class="label">Tertinggi</span>
                        <span id="high" class="value">-</span>
                    </div>
                    <div class="stat-box">
                        <span class="label">Terendah</span>
                        <span id="low" class="value">-</span>
                    </div>
                </div>

                <div class="empty-state">
                    Terakhir diperbarui: <strong id="time">-</strong>
                </div>
            </section>
        </main>
    </div>

    <script>
        let socket;
        let reconnectTimer;
        let reconnectAttempts = 0;

        function getSocketUrl(symbol) {
            const protocol = window.location.protocol === "https:" ? "wss" : "ws";
            const hostname = window.location.hostname || "127.0.0.1";
            const port = window.location.port ? `:${window.location.port}` : "";
            return `${protocol}://${hostname}${port}/ws/${symbol}`;
        }

        function setStatus(statusText, state = "") {
            const elem = document.getElementById("connectionStatus");
            elem.textContent = statusText;
            elem.className = "status-badge";
            if (state) {
                elem.classList.add(state);
            }
        }

        function formatValue(value) {
            if (value === undefined || value === null || value === "") {
                return "-";
            }
            const numeric = Number(value);
            if (Number.isFinite(numeric)) {
                return numeric.toLocaleString("id-ID", {
                    minimumFractionDigits: 2,
                    maximumFractionDigits: 2
                });
            }
            return value;
        }

        function updateMarketData(data) {
            document.getElementById("symbol").textContent = data.symbol || "-";
            document.getElementById("company").textContent = data.company_name || "-";
            document.getElementById("price").textContent = `Rp ${formatValue(data.current_price)}`;
            document.getElementById("high").textContent = `Rp ${formatValue(data.high)}`;
            document.getElementById("low").textContent = `Rp ${formatValue(data.low)}`;
            document.getElementById("time").textContent = new Date().toLocaleTimeString("id-ID");
        }

        function connectSocket() {
            if (reconnectTimer) {
                clearTimeout(reconnectTimer);
            }

            if (socket) {
                socket.close();
            }

            const symbol = document.getElementById("stockSelect").value;
            setStatus("Connecting...", "");

            const socketUrl = getSocketUrl(symbol);
            console.log("Connecting to:", socketUrl);
            socket = new WebSocket(socketUrl);

            socket.onopen = function () {
                console.log("WebSocket Connected:", symbol);
                setStatus("Connected", "connected");
                reconnectAttempts = 0;
            };

            socket.onmessage = function (event) {
                const response = JSON.parse(event.data);
                if (!response.success) {
                    console.error(response.message);
                    return;
                }

                const data = response.data;
                updateMarketData(data);
            };

            socket.onerror = function (error) {
                console.error("WebSocket Error:", error);
                setStatus("Error", "error");
            };

            socket.onclose = function () {
                console.log("WebSocket Disconnected");
                setStatus("Disconnected", "");
                scheduleReconnect(symbol);
            };
        }

        function scheduleReconnect(symbol) {
            reconnectAttempts += 1;
            const delay = Math.min(5000, 1000 * reconnectAttempts);
            console.log(`Reconnect attempt ${reconnectAttempts} in ${delay}ms`);

            reconnectTimer = setTimeout(function () {
                const currentSymbol = document.getElementById("stockSelect").value;
                if (currentSymbol === symbol) {
                    connectSocket();
                }
            }, delay);
        }
    </script>
</body>

</html>
